services:
  - type: web
    name: walletmate-mysql
    env: docker
    plan: free
    region: frankfurt
    image: mysql:8.0
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        sync: false
        value: mysecretpassword
      - key: MYSQL_DATABASE
        value: walletmate
      - key: MYSQL_USER
        value: walletmate_user
      - key: MYSQL_PASSWORD
        sync: false
        value: walletmate_password
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1

  - type: web
    name: walletmate-backend
    env: docker
    region: frankfurt
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar -Dspring.profiles.active=prod target/*.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://walletmate-mysql:3306/walletmate?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
      - key: SPRING_DATASOURCE_USERNAME
        value: walletmate_user
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
        value: walletmate_password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
        value: org.hibernate.dialect.MySQLDialect
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173
    healthCheckPath: /actuator/health
    healthCheckTimeout: 180
    dependencies:
      - walletmate-mysql
