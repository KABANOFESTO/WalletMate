services:
  - type: web
    name: walletmate-mysql
    env: docker
    plan: free
    region: frankfurt
    image: mysql:8.0
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        sync: false
        value: mysecretpassword
      - key: MYSQL_DATABASE
        value: walletmate
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1

  - type: web
    name: walletmate-backend
    env: docker
    region: frankfurt
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar -Dspring.profiles.active=prod target/*.jar
    envVars:
      - key: DB_HOST
        value: walletmate-mysql
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: walletmate
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        sync: false
        value: mysecretpassword
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173
    healthCheckPath: /actuator/health
    healthCheckTimeout: 180
    dependencies:
      - walletmate-mysql
